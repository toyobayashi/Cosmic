version: '3'
services:
  maplestory:
    build: .
    # Keep this service dependency-free so `docker compose up maplestory` can
    # run SQLite without starting the MySQL service. `docker compose up`
    # without a service name still starts both services as before.
    ports:
      # Login server
      - "8484:8484"
      # Channels.
      # Format: WWCC, where WW is 75 plus the world number and CC is 75 plus the channel number (both zero indexed).
      # In this case, world 1 channels 1-3.
      - "7575-7577:7575-7577"
    volumes:
      # Config changes can be reloaded without rebuilding the image.
      # Still requires a redeployment as they're sourced on startup.
      - ./config.yaml:/opt/server/config.yaml
      - ./scripts:/opt/server/scripts
      - ./wz:/opt/server/wz
      # Persists SQLite's database file and its WAL/SHM sidecar files.
      - ./database:/opt/server/database
    environment:
      # Defaults preserve the existing MySQL deployment. Use DB_TYPE=sqlite for SQLite.
      DB_TYPE: "${DB_TYPE:-mysql}"
      DB_HOST: "${DB_HOST:-db}" ## If present this overrides the host in config.yaml.
    
  db:
    image: mysql:8.4.0
    environment:
      MYSQL_DATABASE: "cosmic"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
    ports:
      - "3307:3306"
    volumes:
      - ./database/docker-db-data:/var/lib/mysql
